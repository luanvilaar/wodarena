top_issues:
  - id: TEST-001
    severity: low
    finding: 'A recusa de "exit" com REFAZER em aberto não tem teste: removida a linha, os 27 testes seguem verdes (única mutação que sobreviveu). O teste de pureza confere imports estáticos e algumas chamadas, mas não pega require( nem import( dinâmico.'
    refs: ['src/lib/raceRules.ts:444', 'tests/race-rules.test.mjs:27-34']
    suggested_owner: dev
    suggested_action: 'Na 1.94 ou antes, acrescentar a asserção de que [start, wrong_load, exit] recusa o exit, e incluir require( e import( na regex de pureza.'
  - id: REL-001
    severity: low
    finding: 'Sem meta no snapshot não há trava nem cobrança: Wall Ball sem reps e estação de trechos sem expectedUnits saem "released" sem penalidade, nos dois presets. toRaceCourseStage não deriva expectedUnits da distância (Sled 50 m = 4 tem de vir de quem chama), e seções de BBJ, Farmers e Lunges dependem do mapa do local (F2). Em 2026/27 uma estação de seções incompleta não gera proposta de DQ até lá. Coerente com D6 e documentado pelo @dev.'
    refs: ['src/lib/raceRules.ts:99-100', 'src/lib/raceRules.ts:125-134', 'src/lib/raceRules.ts:446-459']
    suggested_owner: dev
    suggested_action: 'Story 1.94: o snapshot por evento grava reps do Wall Ball e expectedUnits do Sled (distância / 12,5 m) e testa que eles chegam ao motor; deixar explícito na tela que as seções 4 a 7 ainda não cobram falta.'
  - id: REL-002
    severity: low
    status: obsolete
    obsolete_reason: 'Sem DQ (D27/D28), a 2ª estação fora de ordem cobra 180 s de novo; avaliar estação por estação dá o mesmo tempo.'
    finding: 'A contagem de "estação fora de ordem" só atravessa estações via evaluateRaceRun. Se o servidor avaliar cada estação sozinha com evaluateRaceStation sem options, a 2ª ocorrência sai 180 s de novo em vez de proposta de DQ (conferido por script). A contagem segue a ordem do array (percurso), não a cronológica: o total não muda, mas qual das duas vira a proposta pode trocar.'
    refs: ['src/lib/raceRules.ts:386-389', 'src/lib/raceRules.ts:595-607']
    suggested_owner: dev
    suggested_action: 'Story 1.94: recalcular a corrida inteira por evaluateRaceRun (ou passar generalOccurrences), com teste de rota cobrindo duas estações fora de ordem.'
  - id: ARCH-001
    severity: low
    finding: 'undo.of e sourceKey usam a posição 0-based no array de eventos de uma estação. Se o seq da 1.94 for 1-based, global da corrida ou tiver buracos, undo aponta para o evento errado e as chaves deixam de casar com as infrações já revogadas.'
    refs: ['src/lib/raceRules.ts:140-143', 'src/lib/raceRules.ts:296', 'src/lib/raceRules.ts:511-539']
    suggested_owner: dev
    suggested_action: 'Story 1.94: seq contínuo por tentativa (atleta x estação) começando em 0, ou mapear seq do banco para posição antes de chamar o motor; teste de casamento de sourceKey depois de um undo.'
  - id: REL-003
    severity: low
    finding: 'Evento aceito que perde a base depois de um undo some sem aviso: desfazer o "start" depois de 50 reps zera o contador, mas as 50 reps não aparecem em rejected nem em voided (conferido por script). O log fica certo, só o árbitro não vê por quê.'
    refs: ['src/lib/raceRules.ts:502-509']
    suggested_owner: dev
    suggested_action: 'Na 1.97 (tela do Wall Ball): pedir confirmação ao desfazer o start com registros depois dele, ou o motor expor os eventos sem efeito numa lista própria.'
  - id: MNT-001
    severity: low
    finding: 'RACE_RULE_PRESET_2025_26, RACE_RULE_PRESET_2026_27 e RACE_RULE_PRESETS são objetos mutáveis exportados. Um consumidor que edite o preset direto (em vez de createCustomRaceRuleset) muda o padrão do processo inteiro.'
    refs: ['src/lib/raceRulePresets.ts:117-135']
    suggested_owner: dev
    suggested_action: 'Congelar em profundidade os presets ou exportar só uma função que devolve cópia; a edição do regulamento (1.98) sempre por createCustomRaceRuleset.'
  - id: REQ-001
    severity: low
    finding: 'O catálogo é por tipo de estação: BBJ, Farmers e Lunges compartilham "sections". O motor aceita "Sandbag fora dos ombros" (imediata, 15 s) no BBJ e no Farmers, e return_wrong e wrong_load no BBJ (este último o @dev registrou). A filtragem fica para a tela.'
    refs: ['src/lib/raceRulePresets.ts:42-56', 'src/lib/raceRules.ts:393-418']
    suggested_owner: dev
    suggested_action: 'Quando as estações 1 a 7 ganharem tela (F2), filtrar motivos por estação na interface ou levar o catálogo para o nível da estação no regulamento.'
  - id: REQ-002
    severity: low
    status: obsolete
    obsolete_reason: 'Sem DQ (D27): a proposta de DQ deixou de existir.'
    finding: 'Em 2025/26, a 3ª ocorrência de sandbag fora dos ombros gera uma nova proposta de DQ pendente (cada uma a partir da 2ª). Não erra o tempo (0 s, pendente), mas duplica itens no painel do organizador.'
    refs: ['src/lib/raceRules.ts:357-361']
    suggested_owner: po
    suggested_action: 'Decidir na 1.98 se o painel agrupa propostas repetidas da mesma estação ou se o motor gera só uma.'
  - id: REL-004
    severity: low
    finding: 'Re-verificação 2026-10-31: o motor lê o regulamento gravado em race_rulesets.rules. Um regulamento criado antes da mudança da D28 (JSON sem missingUnit.perUnitSeconds e sem wrongLoad.declinedSeconds) faz o motor novo gravar a penalidade de trecho faltando e de "não refez" sem segundos, valendo 0 s, sem erro (conferido numa cópia com o preset antigo). Só atinge evento cuja primeira largada foi antes de 2026-10-30 23h.'
    refs: ['src/lib/raceRules.ts:420', 'src/lib/raceRules.ts:447', 'src/lib/serverRaceSheets.ts:376-382']
    suggested_owner: dev
    suggested_action: 'rulesOf completa os campos que faltam a partir do preset do código (ou recusa com 409 claro), com teste. Antes do primeiro evento real, conferir só por leitura se existe linha em race_rulesets.'
  - id: DOC-002
    severity: low
    finding: 'Re-verificação 2026-10-31: as decisões D27 a D30 (sem DQ, casos de DQ viram tempo, regulamento fixo, sem infração geral à mão) foram aplicadas no código depois deste gate, sem story nem Dev Agent Record. O código segue as decisões e os testes foram trocados sem afrouxar, mas o texto destes ACs, marcados [x], descreve comportamento que não existe mais: AC7, AC8, AC9, AC10 (inteiro), AC11 e AC12 nas partes de DQ e rejected.'
    refs: ['docs/design/fitness-race-sumula/DECISOES.md']
    suggested_owner: po
    suggested_action: 'Anotar cada AC como superado pela decisão correspondente (sem apagar o histórico) antes de mover a story para Done.'
