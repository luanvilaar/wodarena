auto_decisions_review:
  - decision: 'Sandbag fora dos ombros como motivo imediato do catálogo de sections, 2ª ocorrência só proposta de DQ em 2025/26'
    verdict: 'De acordo com o plano ("15 s sem advertência; 2ª ocorrência é DQ") e com D13 (consome a advertência). Ver REQ-001 e REQ-002.'
  - decision: 'Estação fora de ordem contada pela corrida inteira'
    verdict: 'Leitura correta: a 2ª ocorrência acontece em outra estação. Depende de a 1.94 usar evaluateRaceRun (REL-002).'
  - decision: 'REFAZER recusado gera proposta de DQ pendente; REFAZER resolvido fica confirmed com 0 s'
    verdict: 'De acordo com AC7 e o plano ("se não refizer, o árbitro propõe DQ"). confirmed com 0 s não pesa no tempo.'
  - decision: 'Ajuda externa 120 s nos dois presets'
    verdict: 'Aceitável: o plano e o planonovo.md dão "2 ou 3 min, configurável" sem separar temporada; o teste prova a troca para 180 s num custom. Entra na conferência com o regulamento oficial (verified: false).'
  - decision: 'Wall Ball sem reps e trechos sem expectedUnits: sem trava e sem cobrança'
    verdict: 'Coerente com D6 (nenhum número no código), mas transfere o risco para o snapshot da 1.94 (REL-001).'

