    finding: 'Uma TV que abre o link durante uma varredura de tokens no mesmo IP ainda não está no cache de links válidos e recebe 429 até a varredura parar. O mesmo vale para uma TV que ficou mais de 10 min sem consultar ou que cai numa instância nova. A TV já no ar segue funcionando. A TV com link revogado atrás de um IP bloqueado vê 429 ("Sem conexão") em vez do aviso de link desativado. Não vaza dado.'
