schema: 1
story: '1.68'
story_title: 'Distância: Súmula do Judge'
gate: CONCERNS
status_reason: 'Os ACs 1 a 9 têm evidência no código, nos testes e no navegador. A revisão achou um problema real na correção do gestor ("6.330" virava 6,33 m) e ele foi corrigido e coberto por teste antes do gate. Fica uma ressalva não bloqueante: até a Story 1.69 o telão ao vivo mostra a distância com o rótulo de For Time e o total sem unidade.'
reviewer: 'Quinn (Test Architect)'
updated: '2026-10-22T18:00:00-03:00'
expires: '2026-11-05T18:00:00-03:00'
quality_score: 88

top_issues:
  - id: REQ-001
    severity: medium
    status: resolved_in_review
    finding: 'A correção da súmula pelo gestor passava o texto digitado para parseScoreForWorkout("distance", …), que lê "6.330" como 6,33. Um gestor que digitasse o ponto de milhar gravaria 6,33 m e a dupla iria para a última posição, sem aviso e sem passo de confirmação. O judge já era protegido pelo parser de metros (parseMetersInput), o gestor não.'
    refs: ['src/lib/serverScoresheets.ts:1006', 'src/components/admin/ScoresheetsPanel.tsx:74']
    resolution: 'Na correção de uma súmula de distância, o servidor passa a usar parseMetersInput: "6.330" vale 6330, e "6,5", "6.35", "100000" e vazio são recusados com a mensagem do parser. Teste novo no ciclo real da rota (recusas sem mudar nada, 6.350 publica 6350 e corrige o ranking, 6.330 volta ao valor). Os outros formatos seguem pelo parser de sempre.'
  - id: REL-001
    severity: medium
    finding: 'O telão ao vivo ainda não conhece o formato (Story 1.69, decisão 9 do README). Uma prova de distância aparece com o rótulo "For Time", o relógio como "Time cap", a chamada sem linhas e o total de metros sem a unidade. Não quebra nem mostra dado errado, mas confunde o público. As Stories 1.66 a 1.68 já estão em origin/main, então uma prova de distância pode ser criada hoje.'
    refs: ['src/components/broadcast/BroadcastScreen.tsx:42', 'src/components/broadcast/BroadcastScreen.tsx:188', 'src/lib/serverBroadcast.ts:295']
    suggested_owner: po
    suggested_action: 'Não usar o telão ao vivo em evento com prova de distância até a Story 1.69 sair, ou priorizar a 1.69 logo em seguida.'
  - id: REQ-002
    severity: low
    finding: 'O lançamento manual de resultado (rota manual-result e o painel de resultados) usa o mesmo parseScoreForWorkout, então "6.330" numa prova do tipo distance vira 6,33. Já era assim antes desta story, mas fica mais provável agora que o formato tem súmula e o ponto de milhar é o jeito natural de escrever.'
    refs: ['src/app/api/judge/submissions/manual-result/route.ts:75', 'src/lib/scoring.ts:52']
    suggested_owner: dev
    suggested_action: 'Numa story própria, decidir se o tipo distance do lançamento manual aceita só metros inteiros com o ponto de milhar (mexe nos testes de paridade de scoring e no qualifier).'
  - id: REQ-003
    severity: low
    finding: 'Em tela curta, o cartão "Resultado a publicar" fica parcialmente atrás da barra fixa de baixo até o judge rolar a página. É o mesmo padrão das outras súmulas.'
    refs: ['src/components/sheet/DistanceSheetView.tsx']
    suggested_owner: dev
    suggested_action: 'Opcional: reservar um respiro no fim da súmula igual à altura da barra fixa, nas quatro súmulas de uma vez.'
  - id: MNT-001
    severity: low
    finding: 'A lista de súmulas do painel e o quadro de baterias da quadra mostram o resultado oficial como texto cru ("6330"), sem a unidade nem o ponto de milhar que a súmula do judge usa ("6.330 m").'
    refs: ['src/components/admin/ScoresheetsPanel.tsx:284', 'src/components/judge/CourtBoard.tsx:103']
    suggested_owner: dev
    suggested_action: 'Opcional: formatar como "6.330 m" quando a estrutura da prova for de distância.'
waiver: { active: false }

evidence:
  tests_reviewed: 20
  risks_identified: 3
  trace:
    ac_covered: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    ac_gaps: []
  gate_commands:
    npm_test: '1031/1031, rodado pelo QA depois da correção do REQ-001'
    npm_run_lint: '0 erros, 209 warnings (nenhum novo)'
    npm_run_typecheck: 'verde, rodado pelo QA'
    npm_run_build: 'verde, rodado pelo QA'
    coderabbit: 'review_completed, 0 findings sobre os commits 8fe9018 e 72f771c (feito antes do primeiro push); a correção do REQ-001 é revisada no pre-push do próximo commit'
    migration: 'nenhuma'
  independent_checks: 'No servidor de desenvolvimento, em /pt-br/sumula-preview com "Distância 20:00": Iniciar, 4.500 e depois 6330 lançados, o mesmo 6330 de novo não emitiu evento ("Esse total já está lançado."), 100000 mostrou "O total passa de 99.999 m. Confira o número." com aria-invalid e aria-describedby apontando para a mensagem, o log tinha só os dois dist, e depois de "Parar" o cartão mostrou "6.330 m", "= 6,33 km · 2 lançamentos". Com a classe court-light aplicada (tema claro da quadra), uma varredura de contraste WCAG em todos os textos da súmula não achou nenhum abaixo do mínimo, e em 360 e 320 px nenhum elemento passou da largura (a barra fixa sobra 4 px por -mx-1, o padrão das outras súmulas). Um script à parte confirmou o problema do REQ-001 antes da correção (parseScoreForWorkout("distance", "6.330") devolve 6.33).'
  notes: 'Conferido no código: o campo passa por decideDistanceEntry, que usa o parseMetersInput do motor, e a paridade com a tabela de digitação está em teste. O desfazer aponta o último dist que conta (state.history), e dist também é desfazível em findUndoTarget. CourtSheet escreve o resultado em metros na conferência, na confirmação, no cartão publicado e no ausente, mantém Enviar desligado enquanto computeSheetOutcome recusar e não mostra o cronômetro oficial. O envio sem lançamento é recusado também pelo servidor (teste do ciclo real).'

nfr_validation:
  security:
    status: PASS
    notes: 'O servidor não aceita o resultado do aparelho: o envio e o ausente recalculam do log. A correção do gestor agora valida metros inteiros no servidor, e a rota continua exigindo gestor dono ou owner com acesso válido. O texto do resumo é renderizado como texto. Varredura de segredos: vazia.'
  performance:
    status: PASS
    notes: 'A tela deriva o estado com useMemo a partir do log (no máximo 5000 eventos).'
  reliability:
    status: CONCERNS
    notes: 'Fila no aparelho e reenvio idempotente são os de sempre (o dist entra na mesma fila). Ressalva do telão (REL-001) até a Story 1.69.'
  maintainability:
    status: PASS
    notes: 'A decisão do campo é uma função pura em sheetView.ts, testável sem DOM, e o componente só liga estado e eventos.'

regression_review:
  binaries_checked:
    - 'SheetView (despacho: distância, intervalado, carga máxima, segmentos)'
    - 'CourtSheet (resultText, absentResultText, finished, OfficialTimeForm só para For Time e AMRAP, Enviar desligado sem resultado)'
    - 'serverScoresheets.correct (distância pelo parser de metros; os outros formatos pelo parseScoreForWorkout)'
    - 'findUndoTarget (dist desfazível; os outros tipos iguais)'
  outside_scope_ui: 'BroadcastScreen.tsx e serverBroadcast.ts ainda tratam a distância como o "resto" (Story 1.69, REL-001).'
  old_tests_changed: 'tests/court-ui.test.mjs: duas asserções ajustadas só no valor esperado (o título e a confirmação passaram por resultText; o texto antigo continua dentro de resultText para os outros formatos).'
