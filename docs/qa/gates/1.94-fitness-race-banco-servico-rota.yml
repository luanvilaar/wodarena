before_applying_migration:
  - 'Ordem: depois de 20261028120000_service_fee_payer.sql e antes de publicar o código. Só cria tabelas novas; não toca dado nem tabela existente; reaplicar não falha.'
  - 'O banco é único (produção). Depois de aplicar, conferir que service_role tem acesso e anon/authenticated não: select grantee, privilege_type from information_schema.role_table_grants where table_name like ''race_%'';'
  - 'Se a rota seguir respondendo 503 depois de aplicar, recarregar o cache do PostgREST: NOTIFY pgrst, ''reload schema'';'
  - 'Rollback só antes de qualquer gravação (DROP apaga corridas e log); a ordem está no cabeçalho.'
  - 'Sem a 1.96 nada cria race_runs: publicada sozinha, a rota responde 409 "A onda ainda não largou." em open_attempt; nenhum efeito visível para usuário.'
  - 'Os presets seguem verified: false (pendência da 1.93) antes do primeiro evento real.'

