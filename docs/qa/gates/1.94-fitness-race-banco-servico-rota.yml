top_issues:
  - id: TEST-001
    severity: medium
    status: resolved
    resolution: 'Re-gate: testes de judge de gestor vencido (lista, open, append), judge de outro gestor e judge que saiu de event_judges. Mutações do QA derrubadas: assertOrganizerIsOperational do caminho do judge, conferência judge x gestor e acesso por evento do append.'
    finding: 'O AC4 exige gestor com acesso válido também para o judge, mas nenhum teste cobre judge de gestor vencido: tirar assertOrganizerIsOperational do caminho do judge (abrir, gravar) e da lista de eventos do judge deixa os 21 testes verdes. Também sobrevivem: tirar a conferência judge x gestor do evento (o event_judges segura sozinho) e tirar o acesso por evento do append na rota (assertAttemptWriter segura enquanto o judge continuar dono da tentativa, mesmo desatribuído do evento). O código está certo; o risco é uma refatoração futura soltar a trava sem teste avisar.'
    refs: ['src/lib/serverRaceSheetAccess.ts:85-86', 'src/lib/serverRaceSheetAccess.ts:117', 'src/app/api/race-sheets/route.ts:106', 'tests/race-sheets-route.test.mjs:146-161']
    suggested_owner: dev
    suggested_action: 'Acrescentar judge de gestor vencido (open_attempt, append e view=events: 403) e judge que assumiu a tentativa e depois saiu de event_judges (append 403). Pode entrar junto com a 1.95, que cria e atribui judges em evento Race.'
  - id: TEST-002
    severity: low
    status: resolved
    resolution: 'Re-gate: claim concorrente, tentativa/corrida cancelada e mensagem do toString testados. Mutações do QA derrubadas: .is(judge_user_id, null) do claim e Object.hasOwn trocado por in.'
    finding: 'Sem teste: corrida de dois judges assumindo a mesma tentativa sem árbitro (a guarda .is(judge_user_id, null) sobrevive à mutação); tentativa cancelada fora do open e do recálculo (filtros de status cancelled sobrevivem); o caso "toString" confere só o status 400, que também sai pelo caminho do append, então trocar Object.hasOwn por "in" passa.'
    refs: ['src/lib/serverRaceSheets.ts:551-560', 'src/lib/serverRaceSheets.ts:504-507', 'src/lib/serverRaceSheets.ts:860-861', 'src/app/api/race-sheets/route.ts:72', 'tests/race-sheets-route.test.mjs:158']
    suggested_owner: dev
    suggested_action: 'Teste de claim concorrente com onceBeforeUpdate (ou equivalente) e asserção da mensagem "Ação desconhecida." no toString. Tentativa cancelada pode ser coberta pela 1.98, que é quem cancela.'
  - id: REL-001
    severity: low
    finding: 'O recálculo não é serializado por corrida: cada append lê os logs de todas as tentativas da corrida e regrava estado, progresso e infrações de todas. Dois lotes simultâneos em tentativas diferentes da mesma corrida podem gravar progresso velho e até marcar como cancelled a infração recém-criada pela outra (some de computedKeys). Corrige sozinho no próximo lote da corrida. Na F1 não é alcançável (só o Wall Ball abre, uma estação por corrida); vira real quando a F2 ampliar RACE_OPENABLE_STATION_KINDS.'
    refs: ['src/lib/serverRaceSheets.ts:45', 'src/lib/serverRaceSheets.ts:856-951']
    suggested_owner: architect
    suggested_action: 'Antes de abrir mais estações (F2): serializar o recálculo por corrida (advisory lock numa RPC ou versão/contador na race_runs com update condicional). Na 1.97, fechar o tempo a partir do log, não só do status gravado da tentativa.'
  - id: REL-002
    severity: low
    finding: 'readEvents lê o log sem paginação e RACE_MAX_EVENTS_PER_ATTEMPT é 2000, mas o PostgREST do Supabase devolve no máximo 1000 linhas por padrão. Passando de 1000 eventos, count fica em 1000, todo lote cai em 409 (seq repetida) e o motor avalia o log cortado. Inalcançável com Wall Ball de 100 reps; o mesmo padrão já existe na súmula de FF (5000).'
    refs: ['src/lib/serverRaceSheets.ts:49', 'src/lib/serverRaceSheets.ts:519-526']
    suggested_owner: dev
    suggested_action: 'Baixar o limite por tentativa para 1000 ou paginar a leitura com range().'
  - id: ARCH-001
    severity: low
    finding: 'set_ruleset troca o preset na mesma versão quando o regulamento não foi usado; a gravação só é guardada por locked_at nulo. Se a 1.96 criar race_runs antes de preencher locked_at, uma corrida criada entre isRulesetUsed e o update fica com o regulamento reescrito.'
    refs: ['src/lib/serverRaceSheets.ts:415-419', 'src/lib/serverRaceSheets.ts:455-469']
    suggested_owner: dev
    suggested_action: 'Contrato da 1.96: preencher race_rulesets.locked_at antes (ou no mesmo passo) de criar as corridas da onda.'
  - id: REQ-001
    severity: low
    finding: 'append só recusa corrida cancelled. Com a corrida finished, dnf ou disqualified (1.96 a 1.98), o judge dono da tentativa ainda grava e o recálculo muda infrações depois do tempo fechado; penalty_seconds e official_seconds não são recalculados aqui (decisão registrada pelo @dev).'
    refs: ['src/lib/serverRaceSheets.ts:740-742', 'src/lib/serverRaceSheets.ts:856-951']
    suggested_owner: po
    suggested_action: 'Decidir na 1.97/1.98: bloquear append depois do fechamento ou recalcular o tempo oficial a cada lote de corrida encerrada.'
  - id: DOC-001
    severity: low
    finding: 'A revisão do @data-engineer recomendada pelo @po não está registrada na story. O QA refez a validação em PGlite (as 62 migrations em ordem, a nova reaplicada, RLS nas sete, nenhuma policy, nenhum grant para anon/authenticated, service_role nas sete, os 7 índices únicos e os CHECKs de chip e actor_role recusando, cascata do evento). CodeRabbit não rodado (exige commit).'
    refs: ['docs/stories/1.94.story.md:110', 'docs/stories/1.94.story.md:145-153']
    suggested_owner: po
    suggested_action: 'Registrar ou dispensar a revisão do @data-engineer; rodar o CodeRabbit no DoD antes do push.'
  - id: DOC-001b
    severity: low
    finding: 'Re-gate: revisão do @data-engineer agora registrada na story (aprovada com ressalvas). race_decisions_actor_role_check passou a aceitar judge e system (M3): a regra de que só gestor/owner decide fica só no servidor (actorRole devolve owner ou manager); CodeRabbit segue pendente.'
    refs: ['supabase/migrations/20261030120000_race_sheets.sql:196', 'src/lib/serverRaceSheets.ts:422']
    suggested_owner: dev
    suggested_action: 'Na 1.98, gravar judge em actor_role só para registro que não é decisão; CodeRabbit no DoD.'
  - id: DOC-002
    severity: low
    finding: 'Re-verificação 2026-10-31: as decisões D27 a D30 (sem DQ, casos de DQ viram tempo, regulamento fixo, sem infração geral à mão) foram aplicadas no código depois deste gate, sem story nem Dev Agent Record. O código segue as decisões e os testes foram trocados sem afrouxar, mas o texto destes ACs, marcados [x], descreve comportamento que não existe mais: AC5 e AC11 (set_ruleset, D29), AC6 ("só Wall Ball", trocado pela Story 1.102) e AC9 (proposta de DQ pending).'
    refs: ['docs/design/fitness-race-sumula/DECISOES.md']
    suggested_owner: po
    suggested_action: 'Anotar cada AC como superado pela decisão correspondente (sem apagar o histórico) antes de mover a story para Done.'
