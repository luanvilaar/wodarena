auto_decisions_review:
  - decision: 'clientNow obrigatório por lote, deviceAt opcional por evento, janela [clientNow - 24 h, clientNow + 5 s]'
    verdict: 'De acordo com o AC10 e com D9 (offline só com a tela aberta, 24 h de folga basta). Testado.'
  - decision: 'resolveEventTime nunca depois de recorded_at'
    verdict: 'Correto: protege contra relógio adiantado. Testado (mutação sem teto derrubada).'
  - decision: '"Já usado" = locked_at ou alguma corrida apontando; sem uso troca na mesma versão'
    verdict: 'Leitura correta do AC5; a guarda depende de a 1.96 travar antes de criar corridas (ARCH-001).'
  - decision: 'set_ruleset grava em race_decisions'
    verdict: 'Bom: dá trilha à troca de regulamento, coerente com D1/D14. actor_role só manager/owner no banco.'
  - decision: 'Liberar dentro de claim_attempt (release: true)'
    verdict: 'Aceitável: duas camadas (rota com acesso de gestor e serviço com papel); a 1.98 pode expor ação própria.'
  - decision: 'Tentativa sem árbitro: judge que abre assume; gestor/owner leem. Tentativa nova aberta por gestor fica com o gestor'
    verdict: 'Aceitável: gestor dono pode arbitrar (AC4, D4); mesmo comportamento de openSheet.'
  - decision: 'Corrida encerrada não abre tentativa nova; a existente pode ser retomada'
    verdict: 'Aceitável; ver REQ-001 sobre gravar depois do fechamento.'
  - decision: 'Decisão do organizador = decided_at; recálculo pula e todas as gravações levam .is(decided_at, null)'
    verdict: 'Correto e robusto (proteção dupla conferida por mutação em par).'
  - decision: 'Recálculo também no reenvio sem eventos novos'
    verdict: 'Bom: reenvio refaz recálculo interrompido; também atenua REL-001.'
  - decision: 'race_decisions.action com CHECK de formato'
    verdict: 'Aceitável: evita recriar CHECK a cada story; quem grava é só o servidor.'
  - decision: 'race_runs.ruleset_id sem ON DELETE'
    verdict: 'Conferido em PGlite: apagar o evento apaga corridas e regulamentos em cascata sem erro.'

