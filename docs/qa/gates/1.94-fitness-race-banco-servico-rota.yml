  independent_checks: 'Mutação fora do repo (cópia de src/tests/supabase no scratchpad, repo intocado, conferido com cmp): 47 mutações simples + 3 combinadas, 37 derrubadas. Derrubadas, entre as pedidas: reenvio duplicando, 409 ausente e 409 sem serverCount, seq 1-based e com buraco, recálculo estação a estação (REL-002), DQ nascendo confirmed, penalidade nascendo pending, gestor de outro evento, gestor vencido (caminho do gestor), judge liberando (rota e serviço juntos), decisão do organizador sobrescrita (continue e .is juntos) e cancelada pelo undo (guarda e .is juntos). Também: source_key sem tentativa, undo sem cancelar, evento FF aceito, judge não atribuído, set_ruleset por judge, chave de limite sem ação ou sem pessoa, append sem dono, GET attempt sem acesso, corrida encerrada abrindo, Sled abrível, atleta de outro evento, versão usada trocada no lugar, Sled 10 m, desvio com sinal trocado, resolveEventTime sem teto, deviceAt sem janela, sem 503, motor ignorado, limite por tentativa, snapshot sem reps, outro árbitro sem 409 no open, owner bloqueado. Sobreviveram: judge de gestor vencido (2 pontos) e judge sem vínculo com o gestor (TEST-001), append sem acesso por evento na rota (TEST-001), claim sem guarda .is, tentativa cancelada no open e no recálculo, hasOwn trocado por in (TEST-002). Sobrevivem isoladas, mas com proteção dupla (derrubadas em par): continue das decididas, guarda decided_at do undo, conferência de papel do release, 409 do claim.'
  notes: 'Functional Fitness intocado: git diff sem mudança em serverSheetAccess.ts, sheets/route.ts, serverScoresheets.ts, scoresheet.ts, fakeSupabase.mjs nem em migration anterior (impressão SHA-256 das 61 confere); isPresentialEventType igual; o único arquivo de teste antigo alterado é serverModuleHarness.mjs (stub next/link), da Story 1.92. Segurança: requireSession com judge/manager/owner, acesso por evento antes de qualquer leitura ou gravação, LIMITS por pessoa e ação com Object.hasOwn, consultas só pelo query builder (sem SQL montado), mensagens de erro de texto fixo (sem eco da entrada), resposta sem e-mail (teste confere), release só gestor dono/owner em duas camadas, DQ nunca confirmado pelo servidor (só pending), judge sem caminho para decided_at. Conflito de interesse: conta de judge é papel próprio, sem vínculo com atleta no modelo de dados (igual à FF); a autoridade de decidir é só do gestor/owner (actor_role com CHECK manager/owner). GET sem rate limit, como o GET de /api/sheets.'

