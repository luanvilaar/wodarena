top_issues:
  - id: REL-001
    severity: low
    finding: 'readAssignmentRows lê a escala do evento sem paginação. O PostgREST do Supabase devolve no máximo 1000 linhas por padrão; a gravação aceita 500 por escopo, então um evento com muitas ondas ajustadas (por exemplo 12 ondas de 80 linhas) passa de 1000 e a leitura corta linhas sem aviso (escala efetiva e "Minhas estações" errados).'
    refs: ['src/lib/serverRaceAssignments.ts:53-56']
    suggested_owner: dev
    suggested_action: 'Paginar com range() ou limitar o total de linhas por evento; teste com mais de 1000 linhas no banco em memória.'
  - id: REQ-001
    severity: low
    finding: 'Antes da primeira largada, com regulamento criado e não travado, a lista do judge (1.102) lê o percurso do regulamento e a escala lê divisions.course_layout; se o percurso mudar nesse intervalo as chaves divergem e "Minhas estações" pode não casar até a largada. Declarado pelo @dev.'
    refs: ['src/lib/serverRaceAssignments.ts:82-90', 'docs/stories/1.104.story.md:141']
    suggested_owner: dev
    suggested_action: 'Usar a mesma fonte de percurso nas duas leituras (helper único) numa story futura.'
  - id: DATA-001
    severity: low
    finding: 'Linhas de onda apagada do cronograma ficam no banco para sempre: são ignoradas na leitura, mas clear_wave_assignments exige onda do cronograma (404) e a função só limpa judge que saiu do evento. Sem efeito funcional, só resíduo.'
    refs: ['src/lib/serverRaceAssignments.ts:207-216', 'src/lib/serverRaceAssignments.ts:269-275']
    suggested_owner: dev
    suggested_action: 'Na gravação do padrão, apagar também linhas de heat_id fora do cronograma (passar a lista de ondas válidas para a função) ou aceitar o resíduo e registrar.'
  - id: REL-002
    severity: low
    finding: 'clear_wave_assignments é um DELETE direto, fora do pg_advisory_xact_lock que serializa race_save_judge_assignments. Um "Voltar ao padrão" e um "Gravar" da mesma onda no mesmo instante resolvem por ordem de chegada (último vence); não corrompe nada.'
    refs: ['src/lib/serverRaceAssignments.ts:273', 'supabase/migrations/20261101120000_race_judge_assignments.sql:92']
    suggested_owner: dev
    suggested_action: 'Aceitar (dois gestores na mesma onda é raro) ou chamar a função com lista vazia, que já limpa o escopo dentro do lock.'
  - id: A11Y-001
    severity: low
    finding: 'O seletor de escopo usa role="radiogroup"/role="radio" em botões sem navegação por setas nem tabIndex itinerante; leitor de tela anuncia rádio, mas o teclado se comporta como lista de botões.'
    refs: ['src/components/admin/RaceAssignmentsPanel.tsx:180-197', 'src/components/admin/RaceAssignmentsPanel.tsx:224']
    suggested_owner: dev
    suggested_action: 'Trocar por aria-pressed (como o filtro de ondas da 1.105) ou implementar as setas.'
  - id: DOC-001
    severity: low
    finding: 'Pendências do DoD: revisão do @data-engineer, migration aplicada em produção antes do código, CodeRabbit pós-commit e conferência visual do painel no navegador. A pergunta ao Luan (escala orienta e não bloqueia) está respondida na prática pela D41 ("mostra o judge que abriu cartão sem estar na escala, a escala só orienta"), mas o item do DoD segue aberto.'
    refs: ['docs/stories/1.104.story.md:159-164', 'docs/design/fitness-race-sumula/DECISOES.md:80']
    suggested_owner: po
    suggested_action: 'Registrar a D41 como resposta à pergunta; aplicar a migration (ordem abaixo) antes de publicar o código.'
waiver: { active: false }

