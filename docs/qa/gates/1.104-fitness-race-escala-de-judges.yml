status_reason: 'Os 8 ACs estão no código e cobertos por teste; acesso (judge 403, gestor de outro evento e gestor vencido 403, owner pode), validações do save e a regra "onda com linhas substitui o padrão" foram travados por mutação (9 de 9 derrubadas nesta story). A migration foi conferida em PGlite (66 migrations + reaplicação): RLS sem policy, ACL só service_role na tabela e na função, SECURITY DEFINER com search_path fixo, CHECKs, índice único com COALESCE e gravação atômica; está pronta para aplicar antes do código. Ficam só LOWs.'
