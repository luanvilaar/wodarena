    severity: low
    finding: 'Efeito colateral declarado (AUTO-DECISION do @dev): a timeline de Fitness Race passa a esconder as etapas sem split também no lançamento manual de splits (antes mostrava "-"), e o cartão "Estações Total" some sem split de estação. Coerente com o AC6, mas muda a tela de quem já lançava splits à mão.'
