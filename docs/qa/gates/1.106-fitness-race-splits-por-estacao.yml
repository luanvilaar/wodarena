    finding: 'O "Motivo da infração" que o organizador edita ao alterar uma penalidade (texto livre, até 200 caracteres) vai para a chave pública race:penalties do split. O AC5 permite motivo e segundos, e o rótulo padrão vem do regulamento; mas a tela não avisa que esse texto fica público, então um nome ou observação digitado ali seria publicado. Vem da 1.98/1.99, não desta story.'
