story_title: 'Súmula Fitness Race (F1): Painel do organizador, decisões e republicação'
gate: PASS
status_reason: 'Re-gate 2026-10-30: REL-001 e REL-002 fechados (corrida antes da proposta com releitura no 409; correção de largada repetível, corridas primeiro e marca por último); 3 de 5 mutações derrubadas, as 2 sobreviventes são compensações de falha sem teste (TEST-001, LOW). Gate anterior (CONCERNS 85): Os 16 ACs (e o AC7 da 1.96) estão no código e cobertos por teste; acesso (judge e gestor de outro evento 403, só dono ou owner decidem), motivo obrigatório, before completo e o desfazer de DQ e DNF foram travados por mutação. Ficam dois achados MEDIUM do mesmo limite já declarado (sem transação entre a corrida e a decisão): na confirmação de DQ e na correção da largada, uma liberação no mesmo instante deixa o estado pela metade e sem registro em race_decisions. Recomendado corrigir antes do primeiro evento real; não bloqueia.'
