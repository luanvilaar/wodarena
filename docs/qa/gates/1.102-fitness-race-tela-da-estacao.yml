status_reason: 'Os 12 ACs estão no código e cobertos por teste. open_attempt abre os quatro tipos e o Wall Ball, corrida segue 400 sem tentativa; view=stations e view=station_board agrupam pela chave da estação, trazem closesTime por categoria e não expõem e-mail; o cartão roda o motor no aparelho e mostra a recusa dele; Liberar só acende com o contador completo; exit só em trenó e seções com meta e nunca em reps; abandon nunca sai da tela; a estação final abre a tela de 1 atleta sem Soltar nem Dispensar. Wall Ball (1.97) e Functional Fitness sem mudança. Só achados LOW.'
