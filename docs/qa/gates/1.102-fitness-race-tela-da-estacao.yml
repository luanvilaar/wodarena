top_issues:
  - id: A11Y-001
    severity: low
    finding: 'As folhas do cartão (infração da estação, infração geral, Atleta saiu) abrem como role=dialog sem levar o foco para dentro, sem fechar com Esc e sem devolver o foco ao botão que abriu. É o mesmo padrão do WallBallCard aprovado na 1.97; afeta leitor de tela e teclado, não o toque.'
    refs: ['src/components/race/StationCard.tsx:405-415', 'src/components/race/WallBallCard.tsx:230']
    suggested_owner: dev
    suggested_action: 'Num ajuste comum às duas telas: focar o título da folha ao abrir, Esc fecha, foco volta ao botão de origem.'
  - id: UX-001
    severity: low
    finding: 'Conferência visual contra a maquete aprovada (dois-cartoes.html, estados do cartão único e da estação final) não foi feita no navegador: a tela só abre logada e o banco é o de produção. O DoD da story ("Desenho do cartão alinhado com a maquete") segue aberto. AUTO-DECISIONs que mudam a tela ainda sem confirmação explícita do Luan: controles de carga só em seção com carga informada; trenó e seções sem botão Iniciar (o 1º toque leva o start, e o split da 1.106 começa nele); texto de "Atleta saiu" na estação final.'
    refs: ['docs/stories/1.102.story.md:80', 'docs/stories/1.102.story.md:126-129', 'src/lib/raceStation.ts:216-218']
    suggested_owner: ux-design-expert
    suggested_action: 'Conferir as telas com o Luan (ambiente de teste ou dados fictícios) antes do primeiro evento.'
  - id: TEST-001
    severity: low
    finding: 'Falta aparelho real (iPhone e Android): segurar 700 ms no Liberar e no Atleta saiu, vibração (ausente no iPhone), Wake Lock, aba em segundo plano e queda de rede com a fila cheia.'
    refs: ['docs/stories/1.102.story.md:172']
    suggested_owner: dev
    suggested_action: 'Ensaio com dois celulares junto do da 1.103.'
  - id: DOC-001
    severity: low
