    finding: 'Depois do deploy, toda estrutura gravada pela rota (de qualquer formato) e toda súmula nova passam a guardar version 4 com as chaves interval e distance, porque o validador sempre devolve a v4. Se o código voltar para antes da 1.66, o validador antigo recusa version 4 e a chave distance, e deixam de ser lidas as provas de todos os formatos editadas depois do deploy e as súmulas abertas depois dele, não só as de distância. É o mesmo padrão do REL-001 da 1.60.'
