    suggested_owner: devops
    suggested_action: 'Registrar na nota de deploy: depois do deploy, só corrigir para frente (roll-forward), sem reverter. Se a reversão for inevitável, antes converter de volta para a v3 as estruturas que não são de distância.'
  - id: MNT-001
    severity: low
    finding: 'O COMMENT da tabela scoresheet_events ainda lista os tipos de registro como "rep, fill, set, adj, undo, time e attempt" e não cita dist. É só documentação: a coluna event é JSONB com a única checagem "é um objeto", então o evento novo grava sem migration.'
