  independent_checks: 'Script à parte (fora do repo, apagado depois) rodou 20 mil estruturas aleatórias (campos trocados por null, texto longo, caractere nulo, tipos errados, versões 1 a 5): validateWorkoutStructure nunca lançou, devolveu 277 aceitas e 19723 recusadas, toda aceita voltou idêntica ao ser validada de novo e toda recusa saiu em texto sem JSON. Uma estrutura com a chave __proto__ dentro de distance foi recusada e nada poluiu Object.prototype. 20 mil logs aleatórios (dist, undo, rep, time, lixo): deriveDistanceState só devolveu total inteiro de 0 a 99999 ou nulo, computeSheetOutcome sempre fechou value igual ao número do texto e validateClientEvent nunca lançou. parseMetersInput(formatMeters(n)) e parseMetersInput(String(n)) devolveram n para todo n de 0 a 99999.'
  notes: 'Conferido no código: o motor próprio não reaproveita deriveSheetState nem parseEvent (reusa readAt, readUndo e collectVoided). O último dist não anulado vale, sem janela, e o undo de undo não tem efeito (o primeiro desfazer continua valendo). Estrutura que não é de distância não tem lançamentos. A v1, a v2 e a v3 saem v4 com distance nulo, e antes da v4 o formato e a chave têm mensagem própria. O resultado publicado sai só do log gravado (computeSheetOutcome no submit) e nunca do aparelho. O tipo legado distance já existia no CHECK de workouts.type, em WorkoutType e em rankWorkoutScores (maior vence).'

